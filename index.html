<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a3c6e">
  <meta name="description" content="Air Force Agniveervayu CBT Test Platform — realistic Digialm-style computer based test simulator with full mock tests, section timing, question palette and detailed analysis. Works offline.">
  <title>Agniveer Vayu CBT — Air Force Agniveervayu Test Platform</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <div class="seed-box">
      <div class="seed-spin"></div>
      <h3>Loading Agniveer Vayu CBT…</h3>
      <p class="muted">Preparing the local question bank.</p>
    </div>
  </div>

  <!-- site chrome: community stats footer + floating chat (hidden during exams) -->
  <footer id="site-footer" class="site-footer">
    <div class="sf-stats" id="sf-stats">👥 Loading community stats…</div>
    <div class="sf-links">
      <a href="https://anim-kineora.cronyzo7694.workers.dev/" target="_blank" rel="noopener">💬 Community Chat</a>
      <span aria-hidden="true">·</span>
      <span>🔒 Tumhara data sirf tumhare device par — no server, no tracking</span>
      <span aria-hidden="true">·</span>
      <span>Made for Agniveer Vayu aspirants 🇮🇳</span>
    </div>
  </footer>
  <button id="chat-fab" aria-label="Open community chat" aria-expanded="false" title="Community Chat">💬</button>
  <div id="chat-panel" role="dialog" aria-label="Community chat">
    <div class="chat-head">
      <b>💬 Community Chat</b>
      <div class="chat-head-btns">
        <a class="chat-newtab" href="https://anim-kineora.cronyzo7694.workers.dev/" target="_blank" rel="noopener" title="Open in new tab">↗</a>
        <button class="chat-close" aria-label="Close chat" title="Close">✕</button>
      </div>
    </div>
    <iframe class="chat-frame" title="Community chat" referrerpolicy="no-referrer"></iframe>
  </div>

  <script>
    /* view registry (populated by js/views/*.js) */
    const Views = {};
  </script>
  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/db.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/generator.js"></script>
  <script src="js/parsers.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/router.js"></script>
  <script src="js/chrome.js"></script>
  <script src="js/app.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/tests.js"></script>
  <script src="js/views/instructions.js"></script>
  <script src="js/views/exam.js"></script>
  <script src="js/views/result.js"></script>
  <script src="js/views/bank.js"></script>
  <script src="js/views/import.js"></script>
  <script src="js/views/misc.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        App.configCache = await App.config();
        await App.boot();
      } catch (err) {
        console.error(err);
        document.getElementById('app').innerHTML =
          '<div class="error-box"><h2>Storage unavailable</h2><p>This platform stores all data locally (IndexedDB). ' +
          'Private-browsing modes that block storage are not supported. Error: ' + (err && err.message || err) + '</p></div>';
      }
    });
  </script>
</body>
</html>
